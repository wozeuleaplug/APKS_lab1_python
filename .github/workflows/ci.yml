name: CI Workflow

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Build & Test Script (Linux / macOS)
      if: runner.os != 'Windows'
      run: |
        chmod +x ./ci.sh
        ./ci.sh

    - name: Run Build & Test Script (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: ci.bat